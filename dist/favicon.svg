<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" fill="none">
  <style>
    .badge-bg {
      fill: #f8fafc;
      stroke: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      .badge-bg {
        fill: #0f172a;
        stroke: #334155;
      }
    }
  </style>
  <defs>
    <linearGradient id="launchup-fav-prism" x1="6" y1="28" x2="26" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="launchup-fav-core" x1="16" y1="8" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.85" />
