  # ─────────────────────────────────────────────────────
  #  FRONTEND
  # ─────────────────────────────────────────────────────

  web-admin:
    build:
      context: ..
      dockerfile: frontend/admin/Dockerfile.dev
    container_name: launchup-web-admin
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../src:/app/src:ro
      - ../public:/app/public:ro
      - ../index.html:/app/index.html:ro
    networks:
      - launchup_app
    depends_on:
      - auth-service

  # ─────────────────────────────────────────────────────
  #  API GATEWAY (Nginx reverse proxy for dev)
  # ─────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    container_name: launchup-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - client-service
      - project-service
      - governance-service
    networks:
      - launchup_app
      - launchup_dmz
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────────────
#  NETWORKS
# ─────────────────────────────────────────────────────

networks:
  launchup_dmz:
    name: launchup_dmz
    driver: bridge
  launchup_app:
    name: launchup_app
    driver: bridge
  launchup_data:
    name: launchup_data
    driver: bridge
    internal: true  # No external access to data layer

# ─────────────────────────────────────────────────────
#  VOLUMES (persistent data)
# ─────────────────────────────────────────────────────

volumes:
  postgres_data:
    name: launchup_postgres_data
  redis_data:
    name: launchup_redis_data
  kafka_data:
    name: launchup_kafka_data
  minio_data:
    name: launchup_minio_data

